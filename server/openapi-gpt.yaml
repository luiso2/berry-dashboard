openapi: 3.1.0
info:
  title: Berry Bly Productions - GPT Event Management API
  description: |
    Unified API for GPT to control the Berry Bly Productions event dashboard.
    Each user has their own separate data after OAuth authentication.

    ## How to Use
    Use the single `gptSession` endpoint with:
    - `endpoint`: Which manager to use (manageEvents, manageGuests, etc.)
    - `action`: What operation to perform (list, add, update, delete, etc.)
    - Additional parameters based on the action

    ## Available Endpoints
    - **getDashboard** - Get complete overview (no action needed)
    - **manageEvents** - Actions: list, get, getFull, create, update, delete, addTimeline, addChecklist, duplicate
    - **manageGuests** - Actions: list, get, add, update, delete, approve, reject, checkIn, stats, bulkSend
    - **manageBudget** - Actions: getCategories, getSummary, getItems, addItem, updateItem, deleteItem, markPaid
    - **manageStaff** - Actions: list, get, add, update, delete, assignToEvent, getEventStaff, removeAssignment
    - **manageVendors** - Actions: list, get, add, update, delete
    - **manageModels** - Actions: list, get, updateStatus, stats
    - **manageTables** - Actions: list, create, confirm, cancel, stats
    - **manageTickets** - Actions: list, create, checkIn, deleteAll, stats, import
    - **manageSponsors** - Actions: list, get, add, update, delete, stats, sendPortalEmail
    - **managePromoters** - Actions: list, get, add, update, delete, trackSale, leaderboard, stats, payout
    - **manageIntegrations** - Actions: list, connect, disconnect, sync (Eventbrite, Mailchimp)
    - **manageEmails** - Actions: getStatus, getSummary (email tracking via Resend)
    - **manageUploads** - Actions: list, get, stats, getTemplate (file upload tracking)
    - **manageCode** - Actions: list, read, write, search, structure (project code management)
    - **manageSMS** - Actions: send, sendToGuest, sendToEvent, status (SMS messaging via Telnyx)

  version: 3.15.0
  contact:
    name: Berry Bly Productions
    email: concierge@berrybly.com

servers:
  - url: https://berry-dashboard-api-production.up.railway.app

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://berry-dashboard-api-production.up.railway.app/oauth/authorize
          tokenUrl: https://berry-dashboard-api-production.up.railway.app/oauth/token
          scopes:
            read: Read access to your events and data
            write: Write access to your events and data

security:
  - oauth2: [read, write]

paths:
  /api/v1/gpt/session:
    post:
      operationId: gptSession
      summary: Unified GPT session endpoint for all operations
      description: |
        Single endpoint to manage all Berry Bly Productions data.

        **Examples:**

        Get Dashboard:
        ```json
        { "endpoint": "getDashboard" }
        ```

        List Events:
        ```json
        { "endpoint": "manageEvents", "action": "list" }
        ```

        Create Event:
        ```json
        { "endpoint": "manageEvents", "action": "create", "data": { "name": "NYE Gala", "eventDate": "2025-12-31" } }
        ```

        Add Guest (flat format - recommended):
        ```json
        { "endpoint": "manageGuests", "action": "add", "eventId": 1, "name": "John Doe", "email": "john@example.com" }
        ```

        Add Sponsor:
        ```json
        { "endpoint": "manageSponsors", "action": "add", "data": { "companyName": "Moët & Chandon", "tier": "platinum", "amount": 50000 } }
        ```

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  description: Which manager to use
                  enum:
                    - getDashboard
                    - manageEvents
                    - manageGuests
                    - manageBudget
                    - manageStaff
                    - manageVendors
                    - manageModels
                    - manageTables
                    - manageTickets
                    - manageSponsors
                    - managePromoters
                    - manageIntegrations
                    - manageEmails
                    - manageUploads
                    - manageCode
                    - manageSMS
                action:
                  type: string
                  description: |
                    Operation to perform. Required for all endpoints except getDashboard.

                    **manageEvents:** list, get, getFull, create, update, delete, addTimeline, addChecklist, duplicate
                    **manageGuests:** list, get, add, update, delete, approve, reject, checkIn, stats, bulkSend
                    **manageBudget:** getCategories, getSummary, getItems, addItem, updateItem, deleteItem, markPaid
                    **manageStaff:** list, get, add, update, delete, assignToEvent, getEventStaff, removeAssignment
                    **manageVendors:** list, get, add, update, delete
                    **manageModels:** list, get, updateStatus, stats
                    **manageTables:** list, create, confirm, cancel, stats
                    **manageTickets:** list, create, checkIn, deleteAll, stats, import
                    **manageSponsors:** list, get, add, update, delete, stats, sendPortalEmail
                    **managePromoters:** list, get, add, update, delete, trackSale, leaderboard, stats, payout
                    **manageIntegrations:** list, connect, disconnect, sync
                    **manageEmails:** getStatus, getSummary
                    **manageUploads:** list, get, stats, getTemplate
                    **manageCode:** list, read, write, search, structure
                    **manageSMS:** send, sendToGuest, sendToEvent, status
                eventId:
                  type: integer
                  description: Event ID (for event-specific operations)
                guestId:
                  type: integer
                  description: Guest ID (for guest operations)
                staffId:
                  type: integer
                  description: Staff ID (for staff operations)
                vendorId:
                  type: integer
                  description: Vendor ID (for vendor operations)
                modelId:
                  type: integer
                  description: Model ID (for model operations)
                sponsorId:
                  type: integer
                  description: Sponsor ID (for sponsor operations)
                reservationId:
                  type: integer
                  description: Reservation ID (for table operations)
                ticketId:
                  type: integer
                  description: Ticket ID (for ticket operations)
                itemId:
                  type: integer
                  description: Budget item ID (for budget operations)
                assignmentId:
                  type: integer
                  description: Staff assignment ID
                promoterId:
                  type: integer
                  description: Promoter ID (for promoter operations)
                promoterCode:
                  type: string
                  description: Promoter promo code (for tracking sales)
                provider:
                  type: string
                  description: Integration provider (eventbrite, mailchimp)
                emailId:
                  type: string
                  description: Email ID for tracking (from Resend)
                period:
                  type: string
                  description: Time period for leaderboard (week, month, year, all)
                uploadId:
                  type: integer
                  description: Upload ID (for upload operations)
                path:
                  type: string
                  description: File or directory path (for manageCode). Relative to project root (e.g., "src/App.tsx", "server/index.js")
                content:
                  type: string
                  description: File content to write (for manageCode write action)
                searchQuery:
                  type: string
                  description: Text to search for in files (for manageCode search action)
                to:
                  type: string
                  description: Phone number to send SMS to (for manageSMS send action). Can be sent directly or inside data object.
                message:
                  type: string
                  description: SMS message text (for manageSMS actions). Can be sent directly or inside data object.
                name:
                  type: string
                  description: Name field (for guests/staff/vendors/etc). Can be sent directly or inside data object.
                email:
                  type: string
                  description: Email field (for guests/staff/vendors/etc). Can be sent directly or inside data object.
                phone:
                  type: string
                  description: Phone field (for guests/staff/vendors/etc). Can be sent directly or inside data object.
                filters:
                  type: object
                  description: Optional filters for list operations
                  properties:
                    status:
                      type: string
                    category:
                      type: string
                    search:
                      type: string
                    limit:
                      type: integer
                    isPreferred:
                      type: boolean
                data:
                  type: object
                  description: |
                    Data for create/update operations. Fields depend on the endpoint:

                    **Events:** name, eventDate, eventType, venueName, venueCity, expectedAttendance, dressCode, theme, notes, status
                    **Guests:** name, email, phone, instagram, partySize, category, notes
                    **Budget:** categoryId, description, vendorName, estimatedAmount, actualAmount, isPaid, dueDate, notes
                    **Staff:** name, email, phone, role, hourlyRate, experienceLevel, shiftStart, shiftEnd
                    **Vendors:** name, category, contactName, email, phone, website, city, notes, isPreferred
                    **Models:** status (pending, approved, declined, assigned)
                    **Tables:** tableId, tableName, zone, customerName, customerEmail, customerPhone, partySize, minimumSpend
                    **Tickets:** ticketType, holderName, holderEmail, price
                    **Sponsors:** companyName, contactName, email, phone, tier (auto-calculated from amount), amount (determines tier: $1k-5k=bronze, $5k-15k=silver, $15k-35k=gold, $35k-75k=platinum, $75k-150k=diamond, $150k+=title), benefits, status
                    **Promoters:** name, email, phone, commissionRate (default 10%), commissionType (percentage|fixed), bio, socialInstagram, socialTiktok, socialTwitter
                    **PromoterSale:** promoterCode, saleAmount, eventId, guestName, guestEmail (for trackSale action)
                    **PromoterPayout:** amount, paymentMethod, reference, notes (for payout action)
                    **Timeline:** time, title, description, location, isCritical
                    **Checklist:** item, category, priority (high, medium, low)

            examples:
              getDashboard:
                summary: Get dashboard overview
                value:
                  endpoint: getDashboard
              listEvents:
                summary: List all events
                value:
                  endpoint: manageEvents
                  action: list
              createEvent:
                summary: Create a new event
                value:
                  endpoint: manageEvents
                  action: create
                  data:
                    name: "NYE Gala 2025"
                    eventDate: "2025-12-31"
                    venueName: "Grand Ballroom"
                    venueCity: "Miami"
              addGuest:
                summary: Add a guest to event
                value:
                  endpoint: manageGuests
                  action: add
                  eventId: 1
                  name: "John Smith"
                  email: "john@example.com"
              approveGuest:
                summary: Approve a guest
                value:
                  endpoint: manageGuests
                  action: approve
                  guestId: 5
              addSponsor:
                summary: Add a sponsor
                value:
                  endpoint: manageSponsors
                  action: add
                  data:
                    companyName: "Moët & Chandon"
                    tier: platinum
                    amount: 50000
                    contactName: "Jane Doe"
                    email: "jane@moet.com"
              listSponsors:
                summary: List all sponsors
                value:
                  endpoint: manageSponsors
                  action: list
              addBudgetItem:
                summary: Add expense to event budget
                value:
                  endpoint: manageBudget
                  action: addItem
                  eventId: 1
                  data:
                    categoryId: 1
                    description: "DJ Services"
                    estimatedAmount: 5000
                    vendorName: "DJ Khaled"
              listPromoters:
                summary: List all promoters
                value:
                  endpoint: managePromoters
                  action: list
              addPromoter:
                summary: Add a new promoter
                value:
                  endpoint: managePromoters
                  action: add
                  data:
                    name: "Mike Rodriguez"
                    email: "mike@promo.com"
                    phone: "+1234567890"
                    commissionRate: 15
                    bio: "Top nightlife promoter in LA"
                    socialInstagram: "@mikepromo"
              trackPromoterSale:
                summary: Track a sale with promoter code
                value:
                  endpoint: managePromoters
                  action: trackSale
                  data:
                    promoterCode: "MIKE1234"
                    saleAmount: 150.00
                    eventId: 1
                    guestName: "John Doe"
                    guestEmail: "john@example.com"
              getPromoterLeaderboard:
                summary: Get promoter leaderboard
                value:
                  endpoint: managePromoters
                  action: leaderboard
                  period: "month"
              getPromoterStats:
                summary: Get promoter statistics
                value:
                  endpoint: managePromoters
                  action: stats
                  promoterId: 1
              createPromoterPayout:
                summary: Pay out promoter commission
                value:
                  endpoint: managePromoters
                  action: payout
                  promoterId: 1
                  data:
                    amount: 500.00
                    paymentMethod: "venmo"
                    reference: "VNM-123456"
              sendSponsorPortalEmail:
                summary: Send sponsor portal access email
                value:
                  endpoint: manageSponsors
                  action: sendPortalEmail
                  sponsorId: 1
              deleteAllTickets:
                summary: Delete all tickets
                value:
                  endpoint: manageTickets
                  action: deleteAll
              listIntegrations:
                summary: List connected integrations
                value:
                  endpoint: manageIntegrations
                  action: list
              syncEventbrite:
                summary: Sync events from Eventbrite
                value:
                  endpoint: manageIntegrations
                  action: sync
                  provider: "eventbrite"
              getEmailSummary:
                summary: Get email tracking summary
                value:
                  endpoint: manageEmails
                  action: getSummary
              listUploads:
                summary: List all file uploads
                value:
                  endpoint: manageUploads
                  action: list
              getUploadStats:
                summary: Get upload statistics
                value:
                  endpoint: manageUploads
                  action: stats
              getUploadTemplate:
                summary: Get CSV template info
                value:
                  endpoint: manageUploads
                  action: getTemplate
              getUploadDetails:
                summary: Get specific upload details
                value:
                  endpoint: manageUploads
                  action: get
                  uploadId: 1
              getProjectStructure:
                summary: Get project file structure
                value:
                  endpoint: manageCode
                  action: structure
              listSourceFiles:
                summary: List files in src directory
                value:
                  endpoint: manageCode
                  action: list
                  path: "src"
              readFile:
                summary: Read a specific file
                value:
                  endpoint: manageCode
                  action: read
                  path: "src/App.tsx"
              writeFile:
                summary: Write/update a file
                value:
                  endpoint: manageCode
                  action: write
                  path: "src/components/NewComponent.tsx"
                  content: "export default function NewComponent() { return <div>Hello</div>; }"
              searchInCode:
                summary: Search for text in code files
                value:
                  endpoint: manageCode
                  action: search
                  searchQuery: "useState"
              sendSMS:
                summary: Send SMS to a phone number
                value:
                  endpoint: manageSMS
                  action: send
                  to: "+1234567890"
                  message: "Hello! You're confirmed for our event tonight at 8PM."
              sendSMSToGuest:
                summary: Send SMS to a guest by ID
                value:
                  endpoint: manageSMS
                  action: sendToGuest
                  guestId: 5
                  message: "Hi! Just confirming your attendance for tonight's event."
              sendSMSToEvent:
                summary: Send SMS to all event guests
                value:
                  endpoint: manageSMS
                  action: sendToEvent
                  eventId: 1
                  message: "Reminder: Our event starts in 2 hours! See you there."
              checkSMSStatus:
                summary: Check if SMS is configured
                value:
                  endpoint: manageSMS
                  action: status

      responses:
        '200':
          description: Success response (format varies by endpoint and action)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    description: Response data (events, guests, sponsors, etc.)
        '400':
          description: Bad request (missing or invalid parameters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  validEndpoints:
                    type: array
                    items:
                      type: string
        '404':
          description: Resource not found
        '500':
          description: Server error
