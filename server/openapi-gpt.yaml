openapi: 3.1.0
info:
  title: Berry Bly Productions - GPT Event Management API
  description: |
    Unified API for GPT to control the Berry Bly Productions event dashboard.

    ## How to Use
    Use the single `gptSession` endpoint with:
    - `endpoint`: Which manager to use (manageEvents, manageGuests, etc.)
    - `action`: What operation to perform (list, add, update, delete, etc.)
    - Additional parameters based on the action

    ## Available Endpoints
    - **getDashboard** - Get complete overview (no action needed)
    - **manageEvents** - Actions: list, get, getFull, create, update, delete, addTimeline, addChecklist
    - **manageGuests** - Actions: list, get, add, update, delete, approve, reject, checkIn, stats
    - **manageBudget** - Actions: getCategories, getSummary, getItems, addItem, updateItem, deleteItem, markPaid
    - **manageStaff** - Actions: list, get, add, update, delete, assignToEvent, getEventStaff, removeAssignment
    - **manageVendors** - Actions: list, get, add, update, delete
    - **manageModels** - Actions: list, get, updateStatus, stats
    - **manageTables** - Actions: list, create, confirm, cancel, stats
    - **manageTickets** - Actions: list, create, checkIn, stats
    - **manageSponsors** - Actions: list, get, add, updateStatus, stats

  version: 3.1.0
  contact:
    name: Berry Bly Productions
    email: concierge@berrybly.com

servers:
  - url: https://berrydashboard.merktop.com

paths:
  /api/v1/gpt/session:
    post:
      operationId: gptSession
      summary: Unified GPT session endpoint for all operations
      description: |
        Single endpoint to manage all Berry Bly Productions data.

        **Examples:**

        Get Dashboard:
        ```json
        { "endpoint": "getDashboard" }
        ```

        List Events:
        ```json
        { "endpoint": "manageEvents", "action": "list" }
        ```

        Create Event:
        ```json
        { "endpoint": "manageEvents", "action": "create", "data": { "name": "NYE Gala", "eventDate": "2025-12-31" } }
        ```

        Add Guest:
        ```json
        { "endpoint": "manageGuests", "action": "add", "eventId": 1, "data": { "name": "John Doe", "email": "john@example.com" } }
        ```

        Add Sponsor:
        ```json
        { "endpoint": "manageSponsors", "action": "add", "data": { "companyName": "Moët & Chandon", "tier": "platinum", "amount": 50000 } }
        ```

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  description: Which manager to use
                  enum:
                    - getDashboard
                    - manageEvents
                    - manageGuests
                    - manageBudget
                    - manageStaff
                    - manageVendors
                    - manageModels
                    - manageTables
                    - manageTickets
                    - manageSponsors
                action:
                  type: string
                  description: |
                    Operation to perform. Required for all endpoints except getDashboard.

                    **manageEvents:** list, get, getFull, create, update, delete, addTimeline, addChecklist
                    **manageGuests:** list, get, add, update, delete, approve, reject, checkIn, stats
                    **manageBudget:** getCategories, getSummary, getItems, addItem, updateItem, deleteItem, markPaid
                    **manageStaff:** list, get, add, update, delete, assignToEvent, getEventStaff, removeAssignment
                    **manageVendors:** list, get, add, update, delete
                    **manageModels:** list, get, updateStatus, stats
                    **manageTables:** list, create, confirm, cancel, stats
                    **manageTickets:** list, create, checkIn, stats
                    **manageSponsors:** list, get, add, updateStatus, stats
                eventId:
                  type: integer
                  description: Event ID (for event-specific operations)
                guestId:
                  type: integer
                  description: Guest ID (for guest operations)
                staffId:
                  type: integer
                  description: Staff ID (for staff operations)
                vendorId:
                  type: integer
                  description: Vendor ID (for vendor operations)
                modelId:
                  type: integer
                  description: Model ID (for model operations)
                sponsorId:
                  type: integer
                  description: Sponsor ID (for sponsor operations)
                reservationId:
                  type: integer
                  description: Reservation ID (for table operations)
                ticketId:
                  type: integer
                  description: Ticket ID (for ticket operations)
                itemId:
                  type: integer
                  description: Budget item ID (for budget operations)
                assignmentId:
                  type: integer
                  description: Staff assignment ID
                filters:
                  type: object
                  description: Optional filters for list operations
                  properties:
                    status:
                      type: string
                    category:
                      type: string
                    search:
                      type: string
                    limit:
                      type: integer
                    isPreferred:
                      type: boolean
                data:
                  type: object
                  description: |
                    Data for create/update operations. Fields depend on the endpoint:

                    **Events:** name, eventDate, eventType, venueName, venueCity, expectedAttendance, dressCode, theme, notes, status
                    **Guests:** name, email, phone, instagram, partySize, category, notes
                    **Budget:** categoryId, description, vendorName, estimatedAmount, actualAmount, isPaid, dueDate, notes
                    **Staff:** name, email, phone, role, hourlyRate, experienceLevel, shiftStart, shiftEnd
                    **Vendors:** name, category, contactName, email, phone, website, city, notes, isPreferred
                    **Models:** status (pending, approved, declined, assigned)
                    **Tables:** tableId, tableName, zone, customerName, customerEmail, customerPhone, partySize, minimumSpend
                    **Tickets:** ticketType, holderName, holderEmail, price
                    **Sponsors:** companyName, contactName, email, phone, tier (platinum, gold, silver, bronze), amount, benefits, status
                    **Timeline:** time, title, description, location, isCritical
                    **Checklist:** item, category, priority (high, medium, low)

            examples:
              getDashboard:
                summary: Get dashboard overview
                value:
                  endpoint: getDashboard
              listEvents:
                summary: List all events
                value:
                  endpoint: manageEvents
                  action: list
              createEvent:
                summary: Create a new event
                value:
                  endpoint: manageEvents
                  action: create
                  data:
                    name: "NYE Gala 2025"
                    eventDate: "2025-12-31"
                    venueName: "Grand Ballroom"
                    venueCity: "Miami"
              addGuest:
                summary: Add a guest to event
                value:
                  endpoint: manageGuests
                  action: add
                  eventId: 1
                  data:
                    name: "John Smith"
                    email: "john@example.com"
                    instagram: "@johnsmith"
              approveGuest:
                summary: Approve a guest
                value:
                  endpoint: manageGuests
                  action: approve
                  guestId: 5
              addSponsor:
                summary: Add a sponsor
                value:
                  endpoint: manageSponsors
                  action: add
                  data:
                    companyName: "Moët & Chandon"
                    tier: platinum
                    amount: 50000
                    contactName: "Jane Doe"
                    email: "jane@moet.com"
              listSponsors:
                summary: List all sponsors
                value:
                  endpoint: manageSponsors
                  action: list
              addBudgetItem:
                summary: Add expense to event budget
                value:
                  endpoint: manageBudget
                  action: addItem
                  eventId: 1
                  data:
                    categoryId: 1
                    description: "DJ Services"
                    estimatedAmount: 5000
                    vendorName: "DJ Khaled"

      responses:
        '200':
          description: Success response (format varies by endpoint and action)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    description: Response data (events, guests, sponsors, etc.)
        '400':
          description: Bad request (missing or invalid parameters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  validEndpoints:
                    type: array
                    items:
                      type: string
        '404':
          description: Resource not found
        '500':
          description: Server error
